# dsh-yuque-kb bundle patch: inserts the dual-face plugin row into a dsh
# profile. Applied as a profile bundle layer (the dsh.bundle.patch manifest
# field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<this-repo>` or a local path/tarball.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (Yuque adapter, FTS index, agent tools, /api routes),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: yuque-kb
      name: dsh-yuque-kb